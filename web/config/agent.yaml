  2. get_network_statistics()      
    - returns aggregate network health metrics and counters.
    - Response format:
    {
        "structuredContent": {
            "status": "success",
            "statistics": {
                "total_devices": ,
                "total_anomalies": ,
                "unresolved_anomalies": ,
